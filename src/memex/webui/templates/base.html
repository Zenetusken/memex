<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Memex{% endblock %}</title>
  {# Vendored frontend assets — see scripts/vendor-frontend.sh. The
     UI renders fully offline; no third-party fetches at runtime. #}
  <link rel="stylesheet" href="/static/tailwind.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">
  <header class="border-b border-zinc-800 bg-zinc-900/50">
    <div class="max-w-4xl mx-auto px-6 py-4 flex items-center gap-6">
      <a href="/" class="font-bold text-lg">Memex</a>
      <a href="/documents" class="text-zinc-400 hover:text-zinc-100 text-sm">Documents</a>
      <a href="/healthz" class="ml-auto text-zinc-500 hover:text-zinc-100 text-xs">health</a>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-4xl mx-auto px-6 py-6 text-xs text-zinc-600">
    Memex · local-first agentic document understanding
  </footer>
</body>
</html>
