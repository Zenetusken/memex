{# Edit mode of the document title. HTMX target = #doc-title.
   Save POSTs to /documents/{doc_id}/title (form field `title`) which
   round-trips through index.retitle_document — a metadata-only update,
   no re-embed. Cancel re-fetches the view partial via .../title. #}
<form
  hx-post="/documents/{{ document.ref.doc_id }}/title"
  hx-target="#doc-title"
  hx-swap="innerHTML"
  hx-disabled-elt="button[name='save']"
  class="flex items-center gap-2 min-w-0">
  <input
    type="text"
    name="title"
    value="{{ document.frontmatter.title or document.ref.doc_id }}"
    autofocus
    spellcheck="false"
    maxlength="300"
    class="flex-1 min-w-0 bg-zinc-950 border border-zinc-700 focus:border-blue-600 focus:outline-none rounded px-2 py-1 text-lg font-semibold text-zinc-100"
    aria-label="Document title">
  <button name="save" type="submit"
          class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded font-medium text-white text-xs shrink-0">
    save
  </button>
  <button type="button"
          class="btn-quiet text-xs shrink-0"
          hx-get="/documents/{{ document.ref.doc_id }}/title"
          hx-target="#doc-title"
          hx-swap="innerHTML">
    cancel
  </button>
  <span class="htmx-indicator text-zinc-400 text-xs">saving…</span>
</form>
