{# Terminal fragment when a poll hits an unknown/swept cid (e.g. the webui was
   restarted mid-ask). No hx-trigger → the polling chain stops. #}
<div class="ans-flash" role="status">
  <p class="ans-eyebrow">Expired</p>
  <p class="ans-flash-msg">This request is no longer available — please try again.</p>
</div>
