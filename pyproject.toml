[project]
name = "memex"
version = "0.0.1"
description = "Local-first, fully agentic system for turning documents into a queryable Markdown knowledge vault."
authors = [{name = "Memex contributors"}]
license = "Apache-2.0"
requires-python = ">=3.12"
readme = "README.md"
keywords = ["rag", "agents", "local-first", "documents", "knowledge", "langgraph"]

dependencies = [
    # Core data and config
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-ulid>=3.0",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",

    # Agents and orchestration
    "langgraph>=0.2",

    # Inference client — OpenAI-compatible against vLLM (ADR-0001)
    "openai>=1.50",

    # Observability — see ADR-0004 (Langfuse v4 SDK is the supported line).
    # `langchain` is pulled in by langfuse's langchain integration —
    # `langfuse.langchain.CallbackHandler` imports the full langchain
    # package, not just langchain-core. Without an explicit pin, langgraph
    # brings langchain-core only and the import in `observability.tracing`
    # fails at module import time.
    "structlog>=24.4",
    "langfuse>=4,<5",
    "langchain>=0.3",

    # Storage and indexes — see ADR-0005 for the graph store
    "lancedb>=0.30",
    "ryugraph>=25.9",
    "duckdb>=1.5",

    # MCP server SDK — pinned <2 until the breaking transport rework lands
    "mcp>=1.25,<2",

    # Interfaces
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",

    # Vault file watcher (Phase 2)
    "watchdog>=4.0",
]

[project.optional-dependencies]
# Local embedder + reranker + VLM. See ADR-0006 for the dtype + dispatch policy.
# Required to run any GPU path; not required to import the package or run
# unit tests with faked I/O. Resolves `torch` against the cu128 wheel index
# declared below — the default PyPI wheel is CPU-only on Linux.
models = [
    "sentence-transformers>=5.0",
    "transformers>=4.57",
    "torch>=2.7",
    "accelerate>=1.0",
]
# Heavy parser/VLM stack; layers on top of [models].
# pypdfium2 lets the VLM rasterise PDF pages without a system poppler dep.
# flash-attn provides FA2 for the VLM on Ada (sm_89) — FA3 is unavailable
# (see ADR-0006). Linux-only marker because the prebuilt wheel matrix
# only covers Linux + CUDA.
# pyseccomp powers the worker's network-egress sandbox (GUIDELINES
# Part VI). Linux-only — seccomp is a kernel feature; the sandbox
# gracefully no-ops on other platforms.
parse = [
    "docling>=2.0",
    "pypdfium2>=4.30",
    "flash-attn>=2.6 ; sys_platform == 'linux'",
    "pyseccomp>=0.1 ; sys_platform == 'linux'",
]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "pre-commit>=4.0",
]
eval = [
    "ragas>=0.2",
    "jiwer>=3.0",
]
# mkdocs site — `uv run mkdocs serve` + `uv run mkdocs build`. No remote
# fonts (font: false in mkdocs.yml) so the built site is fully offline.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
memex = "memex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memex"]

# ----- Tooling -----

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "ASYNC", # async correctness
    "S",     # bandit (security)
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
strict = ["src/memex"]
pythonVersion = "3.12"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that exercise multiple modules together",
    "eval: agent quality evaluation tests (slow)",
    "slow: tests that take more than one second",
]

# ----- uv wheel resolution — see ADR-0006 -----
# The default PyPI torch wheel on Linux is CPU-only. The PyTorch project
# publishes CUDA wheels at https://download.pytorch.org/whl/cu128 (paired
# with NVIDIA driver R570+). uv picks them up via the explicit index +
# source declarations below; without these, `uv sync --extra models`
# silently lands every model on CPU.

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
