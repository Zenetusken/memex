[project]
name = "memex"
version = "0.0.1"
description = "Local-first, fully agentic system for turning documents into a queryable Markdown knowledge vault."
authors = [{name = "Memex contributors"}]
license = "Apache-2.0"
requires-python = ">=3.12"
readme = "README.md"
keywords = ["rag", "agents", "local-first", "documents", "knowledge", "langgraph"]

dependencies = [
    # Core data and config
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-ulid>=3.0",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",

    # Agents and orchestration
    "langgraph>=0.2",

    # Inference client — OpenAI-compatible against vLLM (ADR-0001)
    "openai>=1.50",

    # Observability — see ADR-0004 (Langfuse v4 SDK is the supported line).
    # `langchain` is pulled in by langfuse's langchain integration —
    # `langfuse.langchain.CallbackHandler` imports the full langchain
    # package, not just langchain-core. Without an explicit pin, langgraph
    # brings langchain-core only and the import in `observability.tracing`
    # fails at module import time.
    "structlog>=24.4",
    "langfuse>=4,<5",
    "langchain>=0.3",

    # Storage and indexes — see ADR-0005 for the graph store
    "lancedb>=0.30",
    "ryugraph>=25.9",
    "duckdb>=1.5",

    # MCP server SDK — pinned <2 until the breaking transport rework lands
    "mcp>=1.25,<2",

    # Interfaces
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",

    # Vault file watcher (Phase 2)
    "watchdog>=4.0",
]

[project.optional-dependencies]
# Local embedder + reranker + VLM. See ADR-0006 for the dtype + dispatch policy.
# Required to run any GPU path; not required to import the package or run
# unit tests with faked I/O. Resolves `torch` against the cu128 wheel index
# declared below — the default PyPI wheel is CPU-only on Linux.
models = [
    "sentence-transformers>=5.0",
    # transformers v5 breaks `from transformers import PreTrainedModel`
    # — the symbol moved and downstream code (sentence-transformers
    # internals, our VLMHandle type) can't resolve it via the lazy
    # import map. Pin to <5 until the ecosystem catches up.
    "transformers>=4.57,<5",
    "torch>=2.7",
    # torchvision is a *direct* dep (not transitive via transformers)
    # so the `[tool.uv.sources]` override below routes it to the
    # cu128 index — uv ignores source overrides on transitive deps
    # (see astral-sh/uv#13774, #8253, #11388).
    "torchvision>=0.22",
    "accelerate>=1.0",
]
# Heavy parser stack; layers on top of [models].
#
# pypdfium2 lets the VLM rasterise PDF pages without a system poppler dep.
# pyseccomp powers the worker's network-egress sandbox (GUIDELINES
# Part VI). Linux-only — seccomp is a kernel feature; the sandbox
# gracefully no-ops on other platforms.
#
# flash-attn is *not* in this extra because its setup.py imports torch
# to detect the CUDA version, which means it can't build before torch
# is installed. The VLM falls back to SDPA without FA2 (slower but
# functional). To enable FA2 on Ada (sm_89), install separately:
#     uv pip install flash-attn --no-build-isolation
# See ADR-0006 for why FA3 is unavailable on sm_89.
parse = [
    "docling>=2.0",
    "pypdfium2>=4.30",
    "pyseccomp>=0.1 ; sys_platform == 'linux'",
]
# vLLM orchestrator. Memex talks to it over the OpenAI-compatible HTTP
# endpoint (ADR-0001); the daemon is started/stopped via
# `scripts/serve-vllm.sh` (which `memex daemon start` shells into). Pin
# to a vLLM that shares torch 2.11+cu128 so installing this extra into
# the same venv doesn't downgrade or fork the torch ABI.
serve = [
    "vllm>=0.21,<0.22",
]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "pre-commit>=4.0",
]
eval = [
    "ragas>=0.2",
    "jiwer>=3.0",
]
# mkdocs site — `uv run mkdocs serve` + `uv run mkdocs build`. No remote
# fonts (font: false in mkdocs.yml) so the built site is fully offline.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
memex = "memex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memex"]

# ----- Tooling -----

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "ASYNC", # async correctness
    "S",     # bandit (security)
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
strict = ["src/memex"]
pythonVersion = "3.12"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that exercise multiple modules together",
    "eval: agent quality evaluation tests (slow)",
    "slow: tests that take more than one second",
]

# ----- uv wheel resolution — see ADR-0006 -----
# The default PyPI torch wheel on Linux is CPU-only. The PyTorch project
# publishes CUDA wheels at https://download.pytorch.org/whl/cu129 (paired
# with NVIDIA driver R570+, CUDA 12.9 runtime). uv picks them up via the
# explicit index + source declarations below; without these, `uv sync
# --extra models` silently lands every model on CPU.
#
# We're on cu129 (not the older cu128) because vLLM 0.21+ ships its
# binary wheels with CUDA 12.9 runtime as the lowest supported floor
# (the PyPI default is CUDA 13.0). cu129 is the highest CUDA toolkit
# release that pairs with the broadest set of community AWQ
# quantisation kernels we depend on.

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.21.0/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
# torchvision must come from the same cu129 index so its custom ops
# (NMS, RoI) register against the matching torch ABI. The default PyPI
# torchvision on Linux is CPU-only and silently fails at
# `from transformers import PreTrainedModel` because modeling_utils
# transitively imports torchvision's loss code, which can't register
# `torchvision::nms` against a cu129 torch.
torchvision = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
# vLLM's PyPI wheel targets CUDA 13.0 runtime by default; we pin the
# cu129 wheel from wheels.vllm.ai instead so the binary's `libcudart`
# matches the rest of the stack.
vllm = [{ index = "vllm-cu129", marker = "sys_platform == 'linux'" }]

# flash-attn imports torch in its setup.py at build time. To install
# it on top of a normal `uv sync`, drop it through uv's pip surface
# after the main sync, with build isolation disabled so it can see
# the already-installed torch:
#     uv pip install flash-attn --no-build-isolation
# `no-build-isolation-package` makes that one-shot command find torch
# in the target venv rather than insisting on a clean build env.
[tool.uv]
no-build-isolation-package = ["flash-attn"]
