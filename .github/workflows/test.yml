name: Tests

# Enforces the three local gates on every PR that touches the package or
# its tests, and on push to main: ruff (lint), pyright (strict types over
# src/memex), and the hermetic pytest suite. Before this workflow the
# gates were trust-the-author / local-only (only benchmark.yml ran in CI);
# a stale `noqa` slipped past on main exactly because nothing enforced
# `ruff check` — see the PR#4/#5 post-mortem.
#
# The whole suite is hermetic + fake-mode (model I/O is faked, not GPU- or
# vLLM-backed), so it runs on the standard CPU ubuntu-latest runner. We do
# NOT install the `serve` extra: vLLM is never imported from `src/memex`
# (Memex talks to it over the OpenAI-compatible HTTP endpoint, ADR-0001),
# so it's dead weight for both pyright and the tests. The cu129 torch wheel
# (from the `models` extra) installs fine without a GPU — it's only used for
# its types (pyright) and CPU-path fakes (pytest).

on:
  # Deliberately NO paths filter. This gate is meant to be a REQUIRED
  # status check in branch protection, and a required check WITH a paths
  # filter dead-locks any PR that doesn't touch those paths — GitHub
  # leaves it stuck "Expected — waiting for status" and the PR can't
  # merge. The hermetic suite is ~47s on cached deps, so running it on
  # every PR is cheap and it's the only shape that's cleanly requireable.
  # (benchmark.yml keeps its paths filter — it's advisory, not required.)
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        # Exact release pins (verified to resolve): setup-uv has no floating
        # `v8` major tag yet — only specific releases like v8.2.0 — so a
        # bare `@v8` fails to resolve. Exact pins are also reproducible.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        # Mirrors the local dev sync minus `serve` (vLLM is unused in src;
        # it's the heaviest, most GPU-coupled extra). `models`+`parse`+`audio`
        # provide every lib the hermetic suite imports at runtime and that
        # pyright resolves statically; `dev` brings ruff/pyright/pytest.
        run: uv sync --extra models --extra parse --extra dev --extra audio

      - name: Lint (ruff)
        run: uv run ruff check src/memex tests

      - name: Type-check (pyright --strict src/memex)
        run: uv run pyright src/memex

      - name: Test (pytest)
        run: uv run pytest -q

  # The eval-data CONVENTION guard (2026-08-29): source documents (the real
  # PDFs, personal statements, anything that isn't a query set) stay LOCAL —
  # only queries.json + baselines ship. Two checks, both fail-fast and
  # dependency-free (pure git/grep, no uv install):
  #   (1) the tracked tests/eval-data/ tree must match the whitelist shapes;
  #   (2) no file added/modified in this run may carry a literal home-dir
  #       path (audit logs etc. must use ~-relative paths, not the real
  #       username — the grep pattern is built by string concatenation so
  #       this file doesn't trip its own check).
  # Deliberately NOT merged into the `gates` job and NOT paths-filtered: it
  # must also be requireable as a status check without dead-locking PRs that
  # don't touch eval-data (the PR#5 lesson in the header above).
  eval-data-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0   # both diff endpoints (base + head) must exist on push AND PR

      - name: Eval-data whitelist (source docs never ship)
        run: |
          set -euo pipefail
          allowed='^(tests/eval-data/README\.md|tests/eval-data/table-split-baseline\.json|tests/eval-data/[^/]+/queries\.json|tests/eval-data/report-structure/(baseline|decks)\.json)$'
          bad=$(git ls-files tests/eval-data/ | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "::error::eval-data convention breach — only query sets + baselines may be committed (source docs stay LOCAL):"
            printf '  %s\n' $bad
            exit 1
          fi
          echo "eval-data tree is whitelist-clean ($(git ls-files tests/eval-data/ | wc -l) files)"

      - name: No home-dir paths in files added or modified this run
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          pat="/h""ome/"   # string-concatenated: this file must not contain the literal
          git diff --name-only --diff-filter=ACMR -z "$base" "$GITHUB_SHA" > /tmp/changed.$$
          bad=$(xargs -0 -r grep -l "$pat" < /tmp/changed.$$ || true)
          if [ -n "$bad" ]; then
            echo "::error::files added/modified this run must not contain a literal home-dir path (use ~-relative):"
            printf '  %s\n' $bad
            exit 1
          fi
          echo "no home-dir paths in the $(tr -cd '\0' < /tmp/changed.$$ | wc -c) file(s) touched this run"
